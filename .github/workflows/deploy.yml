name: 🚀 Liberation Analytics Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options: 
          - staging
          - production
        default: staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: thegreenfieldoverride/liberation-analytics

jobs:
  test:
    name: 🧪 Test Liberation Analytics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build binary
        run: CGO_ENABLED=1 go build -o liberation-analytics ./main.go

      - name: Test binary startup
        run: |
          ./liberation-analytics &
          ANALYTICS_PID=$!
          sleep 5
          
          # Test health endpoint
          if curl -f http://localhost:8080/api/health; then
            echo "✅ Analytics service started successfully"
          else
            echo "❌ Analytics service failed to start"
            exit 1
          fi
          
          kill $ANALYTICS_PID

  deploy:
    name: 🚀 Deploy Liberation Analytics
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Set deployment variables
        run: |
          if [ "${{ github.event.inputs.environment || 'staging' }}" = "production" ]; then
            echo "DEPLOY_PORT=8080" >> $GITHUB_ENV
            # "liberation-analytics", not "-production". The running
            # production container has always been named this, and the port
            # guard, the monitoring checks and every operator habit follow it.
            # The workflow used to name it "-production" and then separately
            # "docker rm liberation-analytics" on every run — including staging
            # deploys — which is how a staging deploy took production down.
            # Removing that line exposed the mismatch rather than causing it.
            echo "CONTAINER_NAME=liberation-analytics" >> $GITHUB_ENV
            echo "DATA_DIR=/mnt/analytics-volume/data" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "IMAGE_TAG=main" >> $GITHUB_ENV
          else
            echo "DEPLOY_PORT=8081" >> $GITHUB_ENV
            # Staging gets its own DuckDB file. It previously mounted
            # /mnt/analytics-volume/data — the production database. DuckDB
            # permits a single writer, so whichever container started first
            # locked the other out. A push to main auto-deploys staging, so
            # merging a PR could and did put production into a restart loop
            # with "Conflicting lock is held in PID 0".
            echo "DATA_DIR=/mnt/analytics-volume/staging-data" >> $GITHUB_ENV
            echo "CONTAINER_NAME=liberation-analytics-staging" >> $GITHUB_ENV
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "IMAGE_TAG=main" >> $GITHUB_ENV
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Deploy Liberation Analytics
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
        run: |
          # accept-new rather than a keyscan step: ssh-keyscan is itself
          # trust-on-first-use, so writing its output to known_hosts bought no
          # security over this and added a step that failed silently when
          # ~/.ssh did not exist. Pin the host key as a secret if real MITM
          # protection is ever wanted.
          ssh -o StrictHostKeyChecking=accept-new $USER@$HOST << 'EOF'
            set -e
            
            echo "🚀 Deploying Liberation Analytics to ${{ env.ENVIRONMENT }}..."
            echo "📦 Container: ${{ env.CONTAINER_NAME }}"
            echo "🔗 Port: ${{ env.DEPLOY_PORT }}"
            
            # Create analytics deployment directory
            sudo mkdir -p /opt/liberation-analytics
            sudo chown deploy-bot:deploy-bot /opt/liberation-analytics
            cd /opt/liberation-analytics
            
            # Update/clone analytics repository
            if [ -d ".git" ]; then
              echo "📥 Updating analytics code..."
              git fetch origin
              git checkout main
              git pull origin main
            else
              echo "📥 Cloning analytics repository..."
              rm -rf * .* 2>/dev/null || true
              git clone https://github.com/thegreenfieldoverride/liberation-analytics.git .
            fi
            
            # Update environment configuration
            echo "⚙️ Configuring environment..."
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Update .env with production values
            sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}/" .env
            sed -i "s/^ENVIRONMENT=.*/ENVIRONMENT=${{ env.ENVIRONMENT }}/" .env
            
            # Ensure proper volume permissions
            echo "📁 Setting up data volumes..."
            sudo mkdir -p ${{ env.DATA_DIR }}
            sudo mkdir -p /mnt/postgres-volume/data
            sudo chown -R 1000:1000 ${{ env.DATA_DIR }}
            sudo chown -R 999:999 /mnt/postgres-volume/data
            
            # Replace ONLY this environment's container.
            #
            # This block also stopped and removed the literal name
            # "liberation-analytics" — production — on every run, including
            # staging deploys. CONTAINER_NAME is templated per environment
            # precisely so the two do not collide, and the hardcoded lines
            # defeated that. A staging deploy took production down.
            # Build FIRST, while the old container is still serving.
            #
            # This used to stop and remove the container, then build. When the
            # build failed — as it did on 2026-08-21, because the Dockerfile
            # pinned Go 1.21.6 against a go.mod requiring 1.24 — there was
            # nothing running and nothing to go back to, because the image
            # prune at the end of the previous run had already deleted the
            # only other image. Analytics was down for eight minutes for a
            # fault that could have been caught before anything was touched.
            #
            # A failed build is now a no-op: the old container never stops.
            echo "🏗️ Building analytics image..."
            NEW_TAG="${{ env.ENVIRONMENT }}-$(git rev-parse --short HEAD)"
            if ! docker build -t "liberation-analytics:${NEW_TAG}" .; then
              echo "::error::Build failed. The running container was not touched."
              exit 1
            fi
            echo "✅ built liberation-analytics:${NEW_TAG}"

            # Record what is currently running, by image ID, so a rollback
            # cannot be defeated by a tag being reused.
            ROLLBACK_IMAGE=$(docker inspect ${{ env.CONTAINER_NAME }} \
              --format '{{.Image}}' 2>/dev/null || echo "")
            echo "🔖 rollback image: ${ROLLBACK_IMAGE:-none (first deploy)}"

            # Port must be free or held by the container this deploy owns.
            EXISTING_CONTAINER=$(docker ps --filter "publish=${{ env.DEPLOY_PORT }}" --format "{{.Names}}" | head -1)
            if [ -n "$EXISTING_CONTAINER" ] && [ "$EXISTING_CONTAINER" != "${{ env.CONTAINER_NAME }}" ]; then
              echo "::error::Port ${{ env.DEPLOY_PORT }} is held by '$EXISTING_CONTAINER', which this deploy does not own."
              exit 1
            fi

            start_container() {
              docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                --restart unless-stopped \
                --network liberation-platform-network \
                -p ${{ env.DEPLOY_PORT }}:8080 \
                -e ENVIRONMENT=${{ env.ENVIRONMENT }} \
                -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
                -e DATABASE_URL=postgres://liberation:${{ secrets.POSTGRES_PASSWORD }}@liberation-postgres:5432/liberation_analytics \
                -e DUCKDB_PATH=/app/data/analytics.db \
                -e ALLOWED_ORIGINS=https://greenfieldoverride.com,https://staging.greenfieldoverride.com,https://writewithstrata.app \
                -v ${{ env.DATA_DIR }}:/app/data \
                "$1"
            }

            # SIGTERM is handled and DuckDB checkpoints on close, so give it
            # room. Killing it early leaves rows only in the write-ahead log.
            echo "🔄 Replacing ${{ env.CONTAINER_NAME }}..."
            docker stop -t 30 ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "🚀 Starting analytics container..."
            if ! start_container "liberation-analytics:${NEW_TAG}" >/dev/null; then
              echo "::error::New container failed to start — restoring previous image"
              docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
              [ -n "$ROLLBACK_IMAGE" ] && start_container "$ROLLBACK_IMAGE" >/dev/null && echo "↩️  restored"
              exit 1
            fi

            echo "🔍 Checking analytics health..."
            healthy=false
            for i in $(seq 1 20); do
              if curl -f -s "http://localhost:${{ env.DEPLOY_PORT }}/api/health" >/dev/null 2>&1; then
                healthy=true; break
              fi
              sleep 3
            done

            if [ "$healthy" != "true" ]; then
              echo "::error::Health check failed — rolling back"
              docker logs ${{ env.CONTAINER_NAME }} --tail 30 || true
              docker stop -t 30 ${{ env.CONTAINER_NAME }} 2>/dev/null || true
              docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
              if [ -n "$ROLLBACK_IMAGE" ] && start_container "$ROLLBACK_IMAGE" >/dev/null; then
                echo "↩️  restored previous image $ROLLBACK_IMAGE"
              else
                echo "⚠️  no previous image — analytics is DOWN"
              fi
              exit 1
            fi
            echo "✅ Analytics is healthy!"

            # Move the environment tag only now that the new image is proven.
            docker tag "liberation-analytics:${NEW_TAG}" "liberation-analytics:${{ env.ENVIRONMENT }}-latest"

            # Prune only AFTER a verified success, and never the image the
            # running container uses. Pruning before verification is what left
            # this deploy with nothing to roll back to.
            echo "🧹 Cleaning up old analytics images..."
            RUNNING_IMAGE=$(docker inspect ${{ env.CONTAINER_NAME }} --format '{{.Image}}' 2>/dev/null || echo "")
            docker images liberation-analytics --format '{{.ID}} {{.Tag}}' \
              | grep "${{ env.ENVIRONMENT }}" \
              | awk '{print $1}' | sort -u \
              | grep -v "$(echo "$RUNNING_IMAGE" | sed 's/sha256://' | cut -c1-12)" \
              | tail -n +3 \
              | xargs -r docker rmi 2>/dev/null || true

            echo "✅ Liberation Analytics deployment complete!"
          EOF

      - name: Verify Analytics Deployment
        run: |
          echo "🔍 Verifying analytics deployment..."
          sleep 10
          
           for i in {1..5}; do
             if curl -f -s http://${{ secrets.HETZNER_HOST }}:${{ env.DEPLOY_PORT }}/api/health; then
               echo "✅ Analytics deployment verified!"
               break
             else
               echo "⏳ Verification attempt $i/5..."
               if [ $i -eq 5 ]; then
                 echo "❌ Analytics verification failed"
                 exit 1
               fi
               sleep 10
             fi
           done

      - name: Analytics Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 SUCCESS: Liberation Analytics deployed!"
            echo "📊 Analytics URL: https://analytics.greenfieldoverride.com"
            echo "🔍 Health Check: http://${{ secrets.HETZNER_HOST }}:${{ env.DEPLOY_PORT }}/api/health"
            echo "🌍 Environment: ${{ env.ENVIRONMENT }}"
            echo "📦 Container: ${{ env.CONTAINER_NAME }}"
            echo "🏃‍♂️ Deployed by: ${{ github.actor }}"
            echo ""
            echo "Next steps:"
            echo "1. Test analytics: curl http://${{ secrets.HETZNER_HOST }}:${{ env.DEPLOY_PORT }}/api/health"
            echo "2. Connect frontend to: https://analytics.greenfieldoverride.com/api"
            echo "3. Monitor logs: ssh and 'docker logs ${{ env.CONTAINER_NAME }}'"
          else
            echo "💥 FAILED: Analytics deployment failed"
            echo "🔍 Check logs above for details"
            exit 1
          fi